<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Chat & Summarizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Include Marked.js for markdown rendering on client -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .system-message .role {
            font-weight: bold;
            color: #d9534f; /* Bootstrap's brand-danger */
        }
        .process-button {
            padding: 8px 16px;
            background-color: #5cb85c;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        .process-button:disabled {
            background-color: #a5d8a5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>YouTube Chat</h1>
            <div class="button-group">
                <button id="btn-expand" class="expand-button">Expand on:</button>
                <button id="btn-clear" class="clear-button">Clear Chat</button>
            </div>
        </div>
        
        <div class="input-form">
            <label for="video_url">YouTube Video URL:</label>
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <input type="text" id="video_url" name="video_url" placeholder="https://youtube.com/watch?v=..." style="flex: 1; padding: 8px;">
                <button id="btn-process" class="process-button">Summarize Video</button>
            </div>
        </div>

        <div id="chat-container">
            <div id="chat-history">
                <!-- Messages will appear here -->
            </div>
            <div class="input-group">
                <input type="text" id="user_message" name="user_message" placeholder="Type your message..." autocomplete="off">
                <button id="btn-send">Send</button>
            </div>
        </div>
    </div>

    <script>
        const chatHistoryDiv = document.getElementById('chat-history');
        const userMessageInput = document.getElementById('user_message');
        const sendButton = document.getElementById('btn-send');
        const processButton = document.getElementById('btn-process');
        const clearButton = document.getElementById('btn-clear');
        const expandButton = document.getElementById('btn-expand');
        const videoUrlInput = document.getElementById('video_url');

        // Allow sending with Enter key
        userMessageInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        sendButton.addEventListener('click', sendMessage);
        processButton.addEventListener('click', processVideo);
        clearButton.addEventListener('click', clearChat);
        expandButton.addEventListener('click', () => {
            userMessageInput.value = 'Expand on: ';
            userMessageInput.focus();
        });

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}-message`;
            
            const roleSpan = document.createElement('span');
            roleSpan.className = 'role';
            roleSpan.innerText = role === 'user' ? 'You:' : (role === 'system' ? 'System:' : 'LLM:');
            
            const textDiv = document.createElement('div');
            if (role === 'llm' || role === 'system') {
                textDiv.innerHTML = marked.parse(text);
                // Simple workaround for marked putting paragraphs
                textDiv.style.display = "inline-block"; 
            } else {
                textDiv.innerText = text;
            }

            div.appendChild(roleSpan);
            div.appendChild(textDiv);
            chatHistoryDiv.appendChild(div);
            
            // Scroll to bottom
            chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;
        }

        async function processVideo() {
            const url = videoUrlInput.value.trim();
            if (!url) return alert('Please enter a YouTube URL');

            processButton.disabled = true;
            processButton.innerText = 'Processing...';

            appendMessage('system', '_Processing video transcript and generating summary..._');

            try {
                const response = await fetch('/api/process_video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ video_url: url })
                });

                const data = await response.json();

                // Remove the processing message
                chatHistoryDiv.lastChild.remove();

                if (response.ok) {
                    appendMessage('llm', data.summary);
                    userMessageInput.focus();
                } else {
                    appendMessage('system', `**Error:** ${data.error}`);
                }
            } catch (err) {
                chatHistoryDiv.lastChild.remove();
                appendMessage('system', `**Network Error:** ${err.message}`);
            }

            processButton.disabled = false;
            processButton.innerText = 'Summarize Video';
        }

        async function sendMessage() {
            const message = userMessageInput.value.trim();
            if (!message) return;

            userMessageInput.value = '';
            sendButton.disabled = true;

            appendMessage('user', message);
            
            // Add loading indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message llm-message';
            loadingDiv.id = 'loading-indicator';
            loadingDiv.innerText = 'LLM is thinking...';
            chatHistoryDiv.appendChild(loadingDiv);
            chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                
                // Remove loading indicator
                document.getElementById('loading-indicator').remove();

                if (response.ok) {
                    appendMessage('llm', data.response);
                } else {
                    appendMessage('system', `**Error:** ${data.error}`);
                }
            } catch (err) {
                document.getElementById('loading-indicator').remove();
                appendMessage('system', `**Network Error:** ${err.message}`);
            }

            sendButton.disabled = false;
            userMessageInput.focus();
        }

        async function clearChat() {
            chatHistoryDiv.innerHTML = '';
            videoUrlInput.value = '';
            
            try {
                await fetch('/api/clear', { method: 'POST' });
            } catch (e) {
                console.error('Failed to clear session on backend', e);
            }
        }
    </script>
</body>
</html>
