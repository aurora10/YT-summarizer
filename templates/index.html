<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Chat &amp; Summarizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>YouTube Chat</h1>
            <div class="button-group">
                <button id="btn-expand" class="expand-button" type="button">Expand on:</button>
                <button id="btn-clear" class="clear-button" type="button">Clear Chat</button>
            </div>
        </div>

        <div class="input-form">
            <label for="video_url">YouTube Video URL:</label>
            <div class="input-row">
                <input type="text" id="video_url" name="video_url"
                       placeholder="https://youtube.com/watch?v=..." autocomplete="off">
                <button id="btn-process" class="process-button" type="button">Summarize Video</button>
            </div>
        </div>

        <div id="chat-container">
            <div id="chat-history" role="log" aria-live="polite" aria-label="Conversation"></div>
            <div class="input-group">
                <label class="visually-hidden" for="user_message">Your message</label>
                <input type="text" id="user_message" name="user_message"
                       placeholder="Type your message..." autocomplete="off">
                <button id="btn-send" type="button">Send</button>
            </div>
        </div>
    </div>

    <!-- Vendored (pinned) so the page needs no third-party origin at runtime. -->
    <script src="{{ url_for('static', filename='vendor/marked.umd.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/purify.min.js') }}"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
